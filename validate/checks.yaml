# The versioned check registry: WHAT each check verifies and WHY, never how.
# Implementations are bound by id in the engine; a registry entry with no
# implementation is reported as an error, not silently passed.
version: 0.2.0
checks:
  - id: INT-001
    family: integrity
    severity: blocking
    method: static
    verifies: "The image file's sha256 equals the digest the release checksums record for its artifact name."
    why: >-
      The checksums file is the attestation subject (SLSA provenance over
      checksums.txt binds every artifact it names); an image whose bytes do not
      match it is not the stamped release.
  - id: INT-002
    family: integrity
    severity: blocking
    method: static
    verifies: "The release evidence attestation verifies offline against the pinned trusted root, with the expected signer identity, and its subject is this bundle's checksums.txt."
    why: >-
      Without a verified attestation the checksums file is just a text file
      anyone could rewrite; this check is what turns "the digest matches" into
      "the digest matches what the release signed". A digest-only run reports
      a skip here, visibly, never a pass.
  - id: COMPAT-001
    family: compatibility
    severity: blocking
    method: static
    verifies: "The variant, Ubuntu release and architecture declared by the artifact name match the validation target."
    why: >-
      Validating the wrong variant or architecture produces a verdict that
      does not describe the image a node will boot; identity must hold before
      any deeper check means anything.
  - id: COMPAT-002
    family: compatibility
    severity: blocking
    method: static
    verifies: "Every component the target BOM names appears in the release SBOM at the required version."
    why: >-
      The image ships no kubeadm or kubelet — the node agent installs the
      Kubernetes stack after provisioning (SPEC.md "Out of scope") — so
      compatibility with a management-plane target is carried by the NVKE
      components baked in: node agent, SPIRE agent, CNI manifests. The attested
      SBOM is the release's own statement of those versions; a mismatch means
      the image was built for a different target, and the failure names the
      incompatible component.
  - id: INT-004
    family: integrity
    severity: warn
    method: guestfs
    verifies: "The image's installed deb package set equals the release SBOM's package set, name and version."
    why: >-
      The SBOM is generated from the built image's own dpkg database and its
      digest rides the attested checksums, so drift here means the bytes under
      test differ from what the release described. Warn severity until
      calibration against more real images earns promotion to blocking.
  - id: HARD-001
    family: hardening
    severity: blocking
    method: guestfs
    verifies: "apt-daily.timer, apt-daily-upgrade.timer and unattended-upgrades.service are masked."
    why: >-
      Ubuntu's background apt runs minutes after first boot and restarts
      journald/networkd/udevd; a daemon-reload in that window loses the node's
      kubeadm init or join (SPEC.md "Background apt"). Nodes take updates
      through a new image, never in place.
  - id: HARD-002
    family: hardening
    severity: blocking
    method: guestfs
    verifies: "multipathd.service and multipathd.socket are masked."
    why: >-
      An unmasked multipathd claims Longhorn's iSCSI-exported volumes through
      device-mapper and newly provisioned volumes never format (SPEC.md
      "multipathd"). No NVKE node boots from a multipath-backed disk.
  - id: HARD-003
    family: hardening
    severity: blocking
    method: guestfs
    verifies: "/var/lib/etcd exists at mode 0700 owned etcd:etcd."
    why: >-
      kubeadm reuses the directory rather than creating a root:root one, which
      is what CIS 1.1.12 checks on the running node (SPEC.md "etcd data
      directory"); asserting it at ship time catches the drift before a node
      ever reports it.
  - id: HARD-004
    family: hardening
    severity: blocking
    method: guestfs
    verifies: "The NVIDIA-tuned kernel flavor is installed: linux-nvidia on amd64, linux-nvidia-64k on arm64."
    why: >-
      The autoinstall sets the kernel flavor at image-build time so the
      generic kernel never lands on disk (SPEC.md "Kernel"); an image with the
      generic flavor is not the qualified configuration.
  - id: SPEC-004
    family: spec
    severity: blocking
    method: guestfs
    verifies: "An nvke-cni-calico-manifests package (nke-cni-calico-manifests on pre-rename releases) is installed; the name carries its own version."
    why: >-
      The Calico manifests package is what bootstrap applies for pod
      networking (SPEC.md "Calico manifests"); without it a node joins and
      never gets a CNI.
  - id: FDE-001
    family: fde
    severity: blocking
    method: guestfs
    appliesTo: {variant: [fde]}
    verifies: "The image carries a LUKS container."
    why: >-
      An artifact named fde that boots an unencrypted root silently voids the
      disk-encryption guarantee the variant name promises; the container's
      presence is the cheapest ship-state assertion of that promise.
  - id: SPEC-001
    family: spec
    severity: blocking
    method: boot
    verifies: "The node agent unit (nvke-agent.service; nke-agent.service on pre-rename releases) is enabled, as systemd resolves it in the booted image."
    why: >-
      The node agent is how the management plane drives the node (SPEC.md
      "nke-agent"); an image whose agent unit is not enabled produces a node
      that boots and is never manageable.
  - id: SPEC-002
    family: spec
    severity: blocking
    method: boot
    verifies: "spire-agent.service is enabled, as systemd resolves it in the booted image."
    why: >-
      The agent authenticates through SPIFFE mTLS; without the SPIRE agent
      enabled the node has no workload identity and the nke-agent handshake
      can never succeed (SPEC.md "SPIRE agent").
  - id: SPEC-003
    family: spec
    severity: blocking
    method: boot
    verifies: "Unit ordering holds: the SPIRE configure unit before spire-agent before the node agent, in systemd's resolved graph (nvke-* names, or nke-* on pre-rename releases)."
    why: >-
      The first-boot renderer must write agent.conf before the SPIRE agent
      starts, and the workload API must exist before nke-agent execs (SPEC.md
      "Unit ordering"); drop-ins decide this, so only the resolved graph — not
      unit files read off disk — answers it truthfully.
  - id: SPEC-005
    family: spec
    severity: blocking
    method: boot
    verifies: "The conntrack tuning is live in the booted kernel: TIME_WAIT timeout 60s with nf_conntrack loaded."
    why: >-
      The files can be present and still not applied if boot ordering breaks
      (SPEC.md "Conntrack limits" documents exactly that service/sysctl
      sequencing); asking the kernel is the only honest assertion.
  - id: COMPAT-003
    family: compatibility
    severity: blocking
    method: boot
    verifies: "The booted image's package database reports every target-BOM component installed at the required version."
    why: >-
      COMPAT-002 checks the release's paperwork; this asks the running system,
      proving the bytes that actually boot carry the target's component set.
      Together they close the chain target BOM → attested SBOM → booted image.
  - id: FDE-002
    family: fde
    severity: blocking
    method: boot
    appliesTo: {variant: [fde]}
    verifies: "luks-tpm-firstboot.service is enabled in the booted image."
    why: >-
      The deferred TPM bind is what removes the shared build-time passphrase
      on real hardware (SPEC.md "TPM binding"); an fde image without it stays
      on the published default passphrase forever.
