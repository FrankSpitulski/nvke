apiVersion: apps/v1
kind: Deployment
metadata:
  name: public-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: public-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: public-api
    spec:
      serviceAccountName: public-api
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: api
        image: management-public-api:dev
        args:
        - --evaluation-no-auth
        - --kubeconfig=/etc/public-api/kubeconfig
        - --page-token-key-file=/etc/public-api/page-token-key
        - --namespace=$(CLUSTER_NAMESPACE)
        - --http-address=:8080
        - --grpc-address=:9090
        - --health-address=:8081
        env:
        - name: CLUSTER_NAMESPACE
          valueFrom:
            configMapKeyRef:
              name: public-api-settings
              key: namespace
        ports:
        - name: http
          containerPort: 8080
        - name: grpc
          containerPort: 9090
        - name: health
          containerPort: 8081
        readinessProbe:
          httpGet:
            path: /readyz
            port: health
          periodSeconds: 5
          timeoutSeconds: 2
        livenessProbe:
          httpGet:
            path: /healthz
            port: health
          periodSeconds: 10
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 128Mi
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
        volumeMounts:
        - name: datastore
          mountPath: /etc/public-api
          readOnly: true
      volumes:
      - name: datastore
        secret:
          secretName: public-api-state-client
          defaultMode: 0440
