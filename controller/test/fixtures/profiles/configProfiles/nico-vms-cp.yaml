hooks:
  beforeJoinNode:
    - runbook:
        name: disable-ipv6-grub
    - runbook:
        name: disable-ipv6-sysctl
    - runbook:
        name: configure-inotify
    - runbook:
        name: enable-ipv4-forward
    - runbook:
        name: disable-swap
    - runbook:
        name: install-chrony
    - runbook:
        name: lvextend
  afterJoinNode:
    - runbook:
        name: remove-ovn-requests

preJoinNodeReboot: true
labels:
  - node-role.kubernetes.io/control-plane=
  - nodeGroup=control-plane
  - node.kubernetes.io/instance-type=cpu
  - nodeType=cpu
