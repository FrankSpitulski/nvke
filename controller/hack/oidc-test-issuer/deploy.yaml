# This is a reference-test deployment fragment. Its AuthenticationConfiguration
# and protected-prefix rules are test policy, not evidence of NKE behavior.
apiVersion: v1
kind: Namespace
metadata:
  name: oidc-test
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oidc-test-issuer
  namespace: oidc-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: oidc-test-issuer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: oidc-test-issuer
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: issuer
          image: docker.local/oidc-test-issuer:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: https
              containerPort: 8443
          readinessProbe:
            httpGet:
              path: /readyz
              port: https
              scheme: HTTPS
            initialDelaySeconds: 1
            periodSeconds: 2
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsGroup: 65532
            runAsNonRoot: true
            runAsUser: 65532
          volumeMounts:
            - name: config
              mountPath: /etc/nke-oidc-test-issuer
              readOnly: true
            - name: runtime
              mountPath: /run/nke-oidc-test-issuer
      volumes:
        - name: config
          configMap:
            name: oidc-test-issuer
        - name: runtime
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: oidc-test-issuer
  namespace: oidc-test
spec:
  selector:
    app.kubernetes.io/name: oidc-test-issuer
  ports:
    - name: https
      port: 8443
      targetPort: https
