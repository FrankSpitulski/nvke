# nico-mock is a nested module, so without a config of its own golangci-lint
# walks up and silently uses controller/.golangci.yml. That is the wrong config
# for this module: it carries the controller's own goimports prefix and its
# accumulated debt exclusions, neither of which applies here.
#
# The linter set is deliberately small, matching controller/nkectl. This module
# is 1,300 lines of HTTP mock; the wider sets elsewhere in the tree carry
# disabled entries for debt that does not exist here, and importing one would
# import its backlog.

version: "2"

run:
  concurrency: 8
  modules-download-mode: readonly
  tests: true
  allow-parallel-runners: true

linters:
  enable:
    - errorlint
    - goheader
    - misspell
    - revive
    - unconvert
    - usestdlibvars
  settings:
    # goheader with no template silently passes every file, so the template is
    # the whole point of enabling it.
    goheader:
      template: |-
        SPDX-FileCopyrightText: Copyright (c) {{MOD_YEAR-RANGE}} NVIDIA CORPORATION & AFFILIATES. All rights reserved.
        SPDX-License-Identifier: LicenseRef-NvidiaProprietary

        NVIDIA CORPORATION, its affiliates and licensors retain all intellectual
        property and proprietary rights in and to this material, related
        documentation and any modifications thereto. Any use, reproduction,
        disclosure or distribution of this material and related documentation
        without an express license agreement from NVIDIA CORPORATION or
        its affiliates is strictly prohibited.
  exclusions:
    generated: lax
    # std-error-handling is what makes the default errcheck usable: it drops
    # the unchecked-return reports on fmt.Fprint* to stdout and stderr. Same
    # four presets as every other module here.
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling

formatters:
  enable:
    - gci
    - gofumpt
  settings:
    gci:
      sections:
        - standard
        - default
        - prefix(github.com/NVIDIA/)
    gofumpt:
      extra-rules: true
