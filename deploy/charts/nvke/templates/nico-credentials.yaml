SPDX-FileCopyrightText: Copyright (c) 2026 NVIDIA CORPORATION & AFFILIATES. All rights reserved.
SPDX-License-Identifier: Apache-2.0

What CAPNICo authenticates to the NICo API with. The name, the namespace and
the four keys are CAPNICo's own defaults and are not configurable on its side.

CAPNICo reads this Secret on every reconcile, so a change takes effect without
a restart. CAPNICo itself is not installed by this chart.
*/ -}}
{{- if .Values.nicoCredentials.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.nicoCredentials.name }}
  namespace: {{ .Values.namespaces.capnico }}
type: Opaque
stringData:
  endpoint: {{ required "nicoCredentials.endpoint is required when nicoCredentials.create is true" .Values.nicoCredentials.endpoint | quote }}
  orgID: {{ required "nicoCredentials.orgID is required when nicoCredentials.create is true" .Values.nicoCredentials.orgID | quote }}
  apiName: {{ required "nicoCredentials.apiName is required when nicoCredentials.create is true" .Values.nicoCredentials.apiName | quote }}
  token: {{ required "nicoCredentials.token is required when nicoCredentials.create is true" .Values.nicoCredentials.token | quote }}
{{- end }}
