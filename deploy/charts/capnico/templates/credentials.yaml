SPDX-FileCopyrightText: Copyright (c) 2026 NVIDIA CORPORATION & AFFILIATES. All rights reserved.
SPDX-License-Identifier: Apache-2.0

The one object this chart adds. CAPNICo reads this Secret but does not create
it, and the documented manual route therefore has two steps: install the chart,
then create the Secret in the namespace the chart made.

Inside one release that ordering is free — helm applies a Namespace before a
Secret — so this chart does both at once.
*/ -}}
{{- if ne .Values.namespace .Release.Namespace }}
{{- fail (printf "namespace is %q but this release is in %q. CAPNICo's chart puts every object in its RELEASE namespace, so the credentials Secret would be written somewhere CAPNICo does not read. Release this chart into %q." .Values.namespace .Release.Namespace .Values.namespace) }}
{{- end }}
{{- if .Values.credentials.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.credentials.name }}
  namespace: {{ .Values.namespace }}
type: Opaque
stringData:
  endpoint: {{ required "credentials.endpoint is required when credentials.create is true" .Values.credentials.endpoint | quote }}
  orgID: {{ required "credentials.orgID is required when credentials.create is true" .Values.credentials.orgID | quote }}
  apiName: {{ required "credentials.apiName is required when credentials.create is true" .Values.credentials.apiName | quote }}
  token: {{ required "credentials.token is required when credentials.create is true" .Values.credentials.token | quote }}
{{- end }}
