apiVersion: v2
name: capnico
description: CAPNICo, the Cluster API infrastructure provider for NICo — its published chart, with the credentials Secret it reads
type: application
version: 0.1.0
appVersion: "v0.0.45"
keywords:
  - nvke
  - nico
  - cluster-api
home: https://github.com/dsx-ai-factory/nvke
sources:
  - https://github.com/dsx-ai-factory/nvke
  - https://github.com/dsx-ai-factory/cluster-api-provider-nico

dependencies:
  # CAPNICo's own published chart, by URL rather than by alias: unlike NICo's,
  # both this chart and the image it references are public, and the chart is
  # stamped at publish time with the matching controller image — so it needs no
  # image override and no pull secret.
  #
  # THERE IS MORE THAN ONE WAY TO INSTALL CAPNICo, AND THEY DO NOT MIX. This
  # chart, the published chart installed directly, and `clusterctl init
  # --infrastructure nico` all create the same capnico-system/controller-manager
  # Deployment under the same names. Installing two of them does not give two
  # installs; it gives two things claiming the same objects. Pick one.
  # See docs/site-bootstrap/infrastructure-providers.md.
  - name: capi-provider-nico
    version: "0.0.45"
    repository: oci://ghcr.io/dsx-ai-factory/cluster-api-provider-nico/charts
    condition: capi-provider-nico.enabled
