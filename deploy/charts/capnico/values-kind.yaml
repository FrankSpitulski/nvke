# A kind cluster changes nothing about CAPNICo. This file exists so the charts
# all take the same arguments, and so there is somewhere obvious to put a
# kind-only override later.
#
#   helm upgrade --install capnico deploy/charts/capnico \
#     --namespace capnico-system --create-namespace
#
# NEEDS HELM 4. Pass --create-namespace, but never `kubectl create namespace`
# first: CAPNICo's chart declares the namespace itself, and helm 3 then refuses
# the install. See README.md.
#
# CAPNICo without Cluster API installs, runs, and reconciles nothing — the
# manager logs against kinds the API server does not know. Run `clusterctl
# init` to give it something to watch.
{}
