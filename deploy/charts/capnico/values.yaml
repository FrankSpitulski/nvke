# CAPNICo reconciles NicoCluster and NicoMachine objects against the NICo API.
# It is the Cluster API provider FOR NICo, not NICo — that is ../nico.
#
# This chart adds one thing to CAPNICo's published chart: the credentials
# Secret, which CAPNICo reads but does not create. Nothing else is overridden,
# because the published chart is already stamped with its matching image.
#
# CAPNICo needs Cluster API itself, which `clusterctl init` installs. Without
# it the manager starts and logs against kinds the API server does not know.

# ---------------------------------------------------------------------------
# Namespace
# ---------------------------------------------------------------------------
# NOT created here. CAPNICo's chart declares the namespace itself, as
# `{{ .Release.Namespace }}` with resource-policy: keep — so this release can
# only live in the namespace CAPNICo should live in, and nothing else may
# create it first.
#
# The name is fixed on CAPNICo's side too: it reads the `nico-credentials`
# Secret from capnico-system by default, and so does nvkectl.
#
# This value only names the namespace the credentials Secret is written into.
# Keep it equal to the release namespace; templates/credentials.yaml refuses
# the render otherwise.
namespace: capnico-system

# ---------------------------------------------------------------------------
# NICo credentials
# ---------------------------------------------------------------------------
# What CAPNICo authenticates to the NICo API with.
#
# The name, the namespace and the four keys are CAPNICo's own defaults and are
# not configurable on its side. CAPNICo reads the Secret on every reconcile, so
# a change takes effect without a restart.
#
# Off by default: nothing here carries a credential. Until the Secret exists,
# `nvkectl get providers` reports the provider as not CONFIGURED — and a
# Secret that exists only means it exists, not that it authenticates. The
# CREDENTIALS column reports that separately.
credentials:
  create: false
  name: nico-credentials
  # The NICo API base URL, http or https, with no user or password.
  endpoint: ""
  orgID: ""
  # The API name in the NICo API path, for example `forge`.
  apiName: ""
  token: ""

# ---------------------------------------------------------------------------
# CAPNICo's published chart
# ---------------------------------------------------------------------------
# Its own values, unchanged. The chart carries a working configuration; the
# keys below are restated only where this deployment depends on them.
capi-provider-nico:
  enabled: true

  manager:
    replicas: 1
    args:
      # Leader election is on. One replica still takes the lease, which is what
      # makes a rolling upgrade safe.
      - --leader-elect
      # The annotations CAPNICo watches for, and the NVKE controller writes.
      # They have to agree with the controller's identity.fieldManager* chain:
      # change them on one side only and nothing reboots or repairs, with no
      # error on either side.
      - --reboot-annotation=nvke.nvidia.com/reboot
      - --repair-annotation=nvke.nvidia.com/machine-health-issue

    # image is deliberately NOT set. The published chart is stamped at publish
    # time with the controller image matching its appVersion, and both are
    # public — so an override here could only make them disagree.
