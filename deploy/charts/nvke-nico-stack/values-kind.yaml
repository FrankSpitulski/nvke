# What a kind cluster changes, for all three charts at once. It is each
# chart's own values-kind.yaml re-keyed, and nothing more.
#
#   helm upgrade --install nvke-nico-stack deploy/charts/nvke-nico-stack \
#     --namespace nvke-system --create-namespace \
#     --values deploy/charts/nvke-nico-stack/values-kind.yaml \
#     --set nvke.database.password=<pick one> \
#     --set nvke.nvke-controller.profiles.image.repository=<repo> \
#     --set nvke.nvke-controller.profiles.image.tag=<tag>

nvke-spire:
  spire:
    spiffe-oidc-discovery-provider:
      replicaCount: 1

nvke:
  postgresql:
    primary:
      persistence:
        size: 8Gi
      resources:
        limits:
          memory: 512Mi
        requests:
          memory: 128Mi
  temporal:
    server:
      replicaCount: 1
    web:
      replicaCount: 1
  nvke-controller:
    resources:
      requests:
        cpu: 100m
        memory: 128Mi

# Turn this on with --set nvke-nico.enabled=true once the `nico` repository
# alias is registered and the images are reachable from the kind node.
nvke-nico:
  certManager:
    issuer:
      create: true
  database:
    sslMode: disable
  vault:
    createSecrets: true
  postgresql:
    primary:
      persistence:
        size: 8Gi
      resources:
        limits:
          memory: 512Mi
        requests:
          memory: 128Mi
