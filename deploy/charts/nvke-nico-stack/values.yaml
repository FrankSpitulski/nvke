# This file sets only what belongs to the combination. Everything else stays in
# the three charts' own values.yaml, which this chart does not restate — a copy
# here would be a second place to change and a second place to get wrong.
#
# cert-manager is a PREREQUISITE, not a dependency, and cannot be made one.
# This release creates Certificate and ClusterIssuer objects, so their CRDs
# have to exist before it is applied — and cert-manager renders its CRDs as
# ordinary templates, so putting it in this release would not help.
#
# `clusterctl init` installs cert-manager. Do not install it separately as
# well: two releases then claim the same cluster-scoped CRDs.
#
# CAPNICo is a separate release, not a subchart here: its published chart
# hardcodes .Release.Namespace and creates it unconditionally, so it can only
# be released into the namespace it lives in. See ../capnico.

global:
  # Read by nvke-nico, which refuses to install a second Temporal while this is
  # set. Temporal's chart has no namespaceOverride, so two Temporals in one
  # release land in one namespace and take each other's Service names.
  nvkeNicoStack: true

# ---------------------------------------------------------------------------
# The three charts
# ---------------------------------------------------------------------------
# Each is configured through its own key, with its own values.yaml as the
# default. To change one, pass that chart's file prefixed with the key, or set
# the path directly:
#
#   --set nvke.database.password=...
#   --set nvke-nico.nico.global.image.tag=...

# A default StorageClass. Off by default: kind already has one, and a cluster
# with real storage brings the CSI driver for it. Turn it on for a bare cluster
# that has neither — PostgreSQL takes a PVC in both the nvke and nico charts,
# and without a default class both sit Pending forever.
#
# Local storage is a lab default. A volume is a directory on one node: it does
# not move, does not replicate, and does not survive the node.
nvke-storage:
  enabled: false

nvke-spire:
  enabled: true

nvke:
  enabled: true

  # Temporal has no namespaceOverride, so it lands in THIS release's namespace.
  # Release this chart into nvke-system, or change this host to match.
  nvke-controller:
    temporal:
      host: temporal-frontend.nvke-system.svc.cluster.local

# Off by default. NICo is published separately from NVKE, so turning it on
# means the `nico` repository alias is registered and
# nvke-nico.nico.global.image.repository and .tag name images this cluster can
# pull.
nvke-nico:
  enabled: false
