apiVersion: v2
name: nvke-nico-stack
description: NVKE, SPIRE and NICo in one release — three of the four charts beside this one, installed together
type: application
version: 0.1.0
appVersion: "0.2.0"
keywords:
  - nvke
  - nico
  - spire
home: https://github.com/dsx-ai-factory/nvke
sources:
  - https://github.com/dsx-ai-factory/nvke

# CAPNICo IS NOT HERE, and cannot be. Its published chart hardcodes
# .Release.Namespace in every object and creates that namespace
# unconditionally, with no override — so as a subchart it would put CAPNICo in
# this umbrella's namespace and then collide with `--create-namespace` over it:
#
#   namespaces "nvke-system" already exists
#   namespaces "capnico-system" not found
#
# Install ../capnico as its own release, into capnico-system. See
# ../capnico/README.md.

dependencies:
  # SPIRE first, and first alphabetically, which is the only ordering helm
  # offers inside one release. It is not enough on its own — see README.md on
  # what this umbrella does and does not sequence.
  - name: nvke-spire
    version: "0.1.0"
    repository: "file://../spire"
    condition: nvke-spire.enabled

  - name: nvke
    version: "0.1.0"
    repository: "file://../nvke"
    condition: nvke.enabled

  # Carries the NICo umbrella chart as a dependency of its own, by the local
  # repository alias `nico`. `helm dependency build` here needs that alias:
  #
  #   helm repo add nico <your NICo chart repository>
  #
  # Without NICo, install ../nvke and ../spire directly rather than this chart.
  - name: nvke-nico
    version: "0.1.0"
    repository: "file://../nico"
    condition: nvke-nico.enabled
