{{- /*
SPDX-FileCopyrightText: Copyright (c) 2026 NVIDIA CORPORATION & AFFILIATES. All rights reserved.
SPDX-License-Identifier: Apache-2.0

Two Secrets, one password.

  <namespace>.nico.forge-pg-cluster.credentials   what nico-api reads
  nico-postgresql-auth                            what the PostgreSQL chart reads

Both are skipped when database.existingSecret is set — then that Secret must
already exist, with the six keys nico-api expects.
*/ -}}
{{- if not .Values.database.existingSecret }}
{{- $d := .Values.database }}
{{- $password := include "nvke-nico.database.password" . }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "nvke-nico.database.secretName" . }}
  namespace: {{ .Values.namespaces.nico }}
type: Opaque
stringData:
  username: {{ $d.user | quote }}
  password: {{ $password | quote }}
  host: {{ $d.host | quote }}
  port: {{ $d.port | quote }}
  dbname: {{ $d.dbName | quote }}
  uri: {{ include "nvke-nico.database.uri" . | quote }}
{{- if .Values.postgresql.enabled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.postgresql.auth.existingSecret }}
  namespace: {{ .Values.postgresql.namespaceOverride | default .Values.namespaces.nico }}
type: Opaque
stringData:
  # The chart's admin user and the NICo user share one password here. Split
  # them by supplying database.existingSecret and a Secret of your own.
  {{ .Values.postgresql.auth.secretKeys.adminPasswordKey }}: {{ $password | quote }}
  {{ .Values.postgresql.auth.secretKeys.userPasswordKey }}: {{ $password | quote }}
{{- end }}
{{- end }}
