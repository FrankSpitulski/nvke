# Defaults for a real cluster. For a kind cluster install with
# `--values values-kind.yaml` as well — it replaces Vault with a cert-manager
# CA, which is the one change that makes NICo installable without a Vault.
#
# TWO values have no default and must be supplied:
#   nico.global.image.repository and .tag   — NICo publishes its own images
#   database.password                       — nothing here carries a credential
#
# NICo's prerequisites are listed in the NICo chart's own PREREQUISITES.md.
# Everything in sections 2, 3, 4 and 5 of that document is created here; the
# cluster operators in section 1 are not, because a seed already has
# cert-manager and the nvke-stack umbrella can install it.

# ---------------------------------------------------------------------------
# Namespaces
# ---------------------------------------------------------------------------
namespaces:
  create: true
  # Where NICo lands. The NICo chart's own default, and the name its Secrets
  # are prefixed with.
  nico: forge-system

# ---------------------------------------------------------------------------
# Certificates
# ---------------------------------------------------------------------------
# NICo signs every service certificate through a cert-manager ClusterIssuer,
# and expects one named vault-nico-issuer backed by a Vault PKI engine.
#
# This chart does not install Vault. On a cluster that has one, leave
# issuer.create false and point issuer.name at the ClusterIssuer that Vault
# backs. Without a Vault — a kind cluster, a laptop, a test lane — set
# issuer.create true and this chart creates a self-signed CA chain under the
# same name instead. NICo cannot tell the difference: it only ever names the
# issuer.
#
# A self-signed CA is NOT a substitute for Vault PKI on a real site. It has no
# revocation, no audit trail and no rotation story, and its private key lives
# in a Secret in this cluster.
certManager:
  # Where a ClusterIssuer of type `ca` reads its CA Secret from. cert-manager's
  # --cluster-resource-namespace, which defaults to its own namespace.
  clusterResourceNamespace: cert-manager
  issuer:
    create: false
    # The name NICo's global.certificate.issuerRef.name points at.
    name: vault-nico-issuer
    # Only read when create is true.
    caSecretName: nico-ca
    bootstrapIssuerName: nico-ca-bootstrap
    commonName: "NICo CA"
    duration: 87600h
    renewBefore: 720h
    privateKey:
      algorithm: ECDSA
      size: 384

# ---------------------------------------------------------------------------
# NICo's database
# ---------------------------------------------------------------------------
# nico-api reads its connection details from one Secret and one ConfigMap. The
# migration job in the nico-api subchart creates and migrates the schema; no
# migration is run by hand.
database:
  # REQUIRED unless existingSecret is set.
  password: ""
  existingSecret: ""

  user: nico
  dbName: nico
  # NICo expects an SSL-enabled PostgreSQL. values-kind.yaml drops this to
  # disable, because the PostgreSQL this chart installs on kind serves no TLS.
  sslMode: require

  # Derived from postgresql.fullnameOverride and namespaces.nico below;
  # restated because a subchart cannot read a sibling's values.
  # CHANGE ALL THREE TOGETHER.
  host: nico-postgresql.forge-system.svc.cluster.local
  port: 5432

  # The Secret nico-api reads its credentials from. Left empty, this chart
  # writes the Secret under whatever name
  # nico.nico-api.envFrom.databaseCredentials.secretName asks for, so the two
  # cannot disagree. Set it only to write the Secret under a different name
  # than nico-api reads — which is a mistake, not a feature.
  secretName: ""

# ---------------------------------------------------------------------------
# Vault
# ---------------------------------------------------------------------------
# NICo reads Vault credentials from two Secrets and its connection details from
# a ConfigMap. This chart does not install Vault.
#
# createSecrets writes the two Secrets from the values below. Leave it false
# where External Secrets, the Vault Secrets Operator or an operator's own
# `kubectl create secret` owns them.
#
# A cluster with no Vault at all — see certManager.issuer.create above — still
# wants the two Secrets to exist, because the NICo services mount them. Empty
# values are enough for that; NICo only fails when it actually calls Vault.
vault:
  createSecrets: false
  approleSecretName: nico-vault-approle-tokens
  tokenSecretName: nico-vault-token
  roleID: ""
  secretID: ""
  token: ""

  # The vault-cluster-info ConfigMap. Created by the NICo chart itself from
  # nico.nico-api.vaultClusterInfo below, not here.
  service: ""
  mount: secrets
  pkiMount: forgeca

# ---------------------------------------------------------------------------
# The SSH console host key
# ---------------------------------------------------------------------------
# nico-ssh-console-rs presents this key to every client that opens a machine
# console. Generate it once and keep it: regenerating it makes every client
# that has the old key report a host-key mismatch.
#
#   ssh-keygen -t ed25519 -f ./ssh_host_ed25519_key -N ""
#   helm ... --set-file sshHostKey.privateKey=./ssh_host_ed25519_key
#
# Not generated by this chart on purpose. Helm would mint a new key on every
# `helm upgrade`, and the OpenSSH format the console expects is not the format
# Helm's key generator emits.
sshHostKey:
  create: true
  name: ssh-host-key
  privateKey: ""

# ---------------------------------------------------------------------------
# PostgreSQL
# ---------------------------------------------------------------------------
postgresql:
  enabled: true

  # Pinned, and load-bearing: the Bitnami chart names its primary Service after
  # the chart fullname exactly, so this IS the hostname half of database.host.
  fullnameOverride: nico-postgresql
  namespaceOverride: forge-system

  auth:
    username: nico
    database: nico
    existingSecret: nico-postgresql-auth
    secretKeys:
      adminPasswordKey: postgres-password
      userPasswordKey: password

  primary:
    persistence:
      enabled: true
      size: 20Gi
      storageClass: ""
    resources:
      limits:
        memory: 512Mi
      requests:
        memory: 256Mi

    # nico, plus the two databases NICo's Temporal needs when temporal.enabled
    # is on. Created unconditionally: initdb runs once, on an empty data
    # directory, so there is no later point at which they could be added, and
    # two empty databases cost nothing.
    initdb:
      scripts:
        init-temporal.sql: |
          CREATE DATABASE temporal;
          CREATE DATABASE temporal_visibility;

  # PINNED BY DIGEST, for the same reason as the nvke chart: bitnami/postgresql
  # on Docker Hub no longer publishes version tags, so there is no version to
  # pin to and a digest is the only durable reference.
  image:
    digest: "sha256:b74b23f091dcc87041bcae557d840c36458af46b955279cb13aedec4c32d7f71"

# ---------------------------------------------------------------------------
# Temporal
# ---------------------------------------------------------------------------
# NICo's Temporal, which is NOT the NVKE controller's. Both default to a
# release named `temporal`, so they must not share a namespace.
#
# Temporal's chart has no namespaceOverride — its templates follow
# .Release.Namespace — so this one lands wherever THIS chart is released.
# Release this chart on its own, into its own namespace, to use it. Inside the
# nvke-stack umbrella it is refused outright, because there the two would land
# together.
temporal:
  enabled: false

  # Pinned so nico-temporal-frontend.<namespace>.svc.cluster.local stays
  # correct whatever the release is called, AND so that nothing it creates
  # shares a name with the NVKE controller's Temporal.
  fullnameOverride: nico-temporal

  server:
    configMapsToMount: sprig
    setConfigFilePath: true
    config:
      persistence:
        default:
          driver: sql
          sql:
            driver: postgres12
            # CHANGE WITH database.host ABOVE.
            host: nico-postgresql.forge-system.svc.cluster.local
            port: 5432
            database: temporal
            user: nico
            existingSecret: nico-postgresql-auth
            secretKey: password
            maxConns: 10
            maxIdleConns: 5
        visibility:
          driver: sql
          sql:
            driver: postgres12
            host: nico-postgresql.forge-system.svc.cluster.local
            port: 5432
            database: temporal_visibility
            user: nico
            existingSecret: nico-postgresql-auth
            secretKey: password
            maxConns: 10
            maxIdleConns: 5

  schema:
    createDatabase:
      enabled: true
    setup:
      enabled: true
    update:
      enabled: true

  cassandra:
    enabled: false
  mysql:
    enabled: false
  postgresql:
    enabled: false
  prometheus:
    enabled: false
  grafana:
    enabled: false
  elasticsearch:
    enabled: false

# ---------------------------------------------------------------------------
# The NICo umbrella chart
# ---------------------------------------------------------------------------
nico:
  enabled: true

  global:
    # REQUIRED. NICo publishes its own images; this chart names no registry.
    image:
      repository: ""
      tag: ""
      pullPolicy: IfNotPresent

    # Shared with every other subchart in an umbrella, so a value here reaches
    # the NVKE controller and PostgreSQL too. Both ignore it when it is empty.
    imagePullSecrets: []

    certificate:
      issuerRef:
        kind: ClusterIssuer
        # Must match certManager.issuer.name above.
        name: vault-nico-issuer
        group: cert-manager.io

    spiffe:
      # NICo's own trust domain, separate from the NVKE controller's. The two
      # SPIFFE deployments do not federate.
      trustDomain: nico.local

  # EVERY subchart below is pinned to namespaces.nico above.
  #
  # Each NICo subchart resolves its namespace as its OWN namespaceOverride,
  # else the release namespace — there is no global that sets them all. Without
  # these, NICo lands in whichever namespace this chart is released into, which
  # inside the nvke-stack umbrella is the umbrella's namespace rather than
  # NICo's. The prerequisite Secrets this chart writes would then be in one
  # namespace and the services that mount them in another.
  #
  # templates/validate.yaml refuses an install where any of them disagrees with
  # namespaces.nico, so this cannot drift silently.

  nico-api:
    namespaceOverride: forge-system

    # The names nico-api reads its credentials and connection details under.
    # The Secret is written by this chart's templates/database-secret.yaml,
    # which reads the name from HERE — so changing it changes both sides.
    #
    # The chart's own default is nico-system.nico.nico-pg-cluster.credentials,
    # which names a namespace this deployment does not use.
    envFrom:
      databaseCredentials:
        secretName: nico.forge-pg-cluster.credentials

    # The NICo chart creates both ConfigMaps when these are non-empty, so
    # neither is created here.
    # CHANGE WITH database.host ABOVE.
    databaseConfig:
      DB_HOST: nico-postgresql.forge-system.svc.cluster.local
      DB_PORT: "5432"
      DB_NAME: nico

    # Without this the vault-cluster-info ConfigMap is never created, and every
    # NICo service that mounts it sits at ContainerCreating with no other
    # indication why. The values are read only when NICo actually calls Vault,
    # so a cluster with no Vault can leave VAULT_SERVICE empty.
    vaultClusterInfo:
      VAULT_SERVICE: ""
      NICO_VAULT_MOUNT: secrets
      NICO_VAULT_PKI_MOUNT: forgeca

    # nico-api EXITS AT STARTUP without resource pools, so siteConfig is not
    # optional. The four pools below are the required minimum and their ranges
    # are placeholders — replace them with the site's address plan.
    siteConfig:
      enabled: true
      nicoApiSiteConfig: |
        dhcp_servers = ["nico-dhcp.forge-system.svc.cluster.local:67"]
        enable_route_servers = true
        initial_domain_name = "site.example.com"
        sitename = "site"

        [pools.lo-ip]
        type = "ipv4"
        ranges = [{ start = "10.0.0.0", end = "10.0.1.0" }]

        [pools.vlan-id]
        type = "integer"
        ranges = [{ start = "100", end = "501" }]

        [pools.vni]
        type = "integer"
        ranges = [{ start = "1024500", end = "1024800" }]

        [pools.vpc-vni]
        type = "integer"
        ranges = [{ start = "0", end = "100" }]

  # Pinned for the same reason, even though they are off: turning one on later
  # should not move it into a different namespace from the rest.
  nico-bmc-proxy:
    namespaceOverride: forge-system
  nico-dhcp:
    namespaceOverride: forge-system
  nico-dns:
    namespaceOverride: forge-system
  nico-hardware-health:
    namespaceOverride: forge-system
  nico-pxe:
    namespaceOverride: forge-system
  nico-ssh-console-rs:
    namespaceOverride: forge-system

  # DPF and RMS are not part of the NICo chart and are not installed here.
  # The optional subcharts below are off: a seed runs a reduced NICo.
  nico-dsx-exchange-consumer:
    enabled: false
    namespaceOverride: forge-system
  nico-ntp:
    enabled: false
    namespaceOverride: forge-system
  unbound:
    enabled: false
    namespaceOverride: forge-system
  # The one subchart that reads global.namespaceOverride rather than its own.
  # A global would reach every other chart in an umbrella too, so it is not set
  # here — turn this subchart on and it lands in the release namespace.
  nico-machine-a-tron:
    enabled: false
  nico-postgres-exporter:
    enabled: false
    namespaceOverride: forge-system
