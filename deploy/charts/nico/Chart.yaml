apiVersion: v2
name: nvke-nico
description: NICo for an NVKE cluster — the NICo umbrella chart with the prerequisites it expects to find already in place
type: application
version: 0.1.0
appVersion: "v2025.12.30-rc1"
keywords:
  - nvke
  - nico
  - bare-metal
home: https://github.com/dsx-ai-factory/nvke
sources:
  - https://github.com/dsx-ai-factory/nvke

dependencies:
  # The NICo umbrella chart, by local repository ALIAS rather than by URL.
  # NICo is published separately from NVKE, so this chart does not name a
  # registry — add the repository under the name `nico` once, and both
  # `helm dependency build` here and in ../nvke-nico-stack resolve it:
  #
  #   helm repo add nico <your NICo chart repository>
  #
  # Without that repository `helm dependency build` fails here. Install
  # ../nvke and ../spire directly if you do not have NICo.
  - name: nico
    version: "0.1.1"
    repository: "@nico"
    condition: nico.enabled

  # NICo's own database. nico-api needs one; the NICo chart does not bring it.
  # Turn it off to point NICo at a database something else manages.
  - name: postgresql
    version: "18.5.15"
    repository: oci://registry-1.docker.io/bitnamicharts
    condition: postgresql.enabled

  # NICo's Temporal, which is NOT the NVKE controller's. Off by default, and
  # refused inside the nvke-nico-stack umbrella: Temporal's chart has no
  # namespaceOverride, so two of them in one release land in one namespace and
  # collide. See templates/validate.yaml.
  - name: temporal
    version: "0.74.0"
    repository: https://go.temporal.io/helm-charts
    condition: temporal.enabled
