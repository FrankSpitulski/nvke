name: Image Validate NVCR

# Builds the site validation image (controller/test/e2e/Dockerfile) and
# publishes it beside the controller image, from the same commit and under the
# same version: nvcr.io/<org>/nvke-validate:<version> next to
# nvcr.io/<org>/nvke-controller:<version>. A site running a controller version
# can then run the tests that shipped with it.
#
# Triggers, versioning, tags and the DSX promotion follow image-nvcr.yml; see
# its header for why. The differences:
#
# - One build job, not one per architecture plus a manifest job. The test
#   binary is cross-compiled and the final stage runs nothing, so both
#   architectures build on one runner without emulation and buildx pushes the
#   index itself.
# - No GHCR copy. The consumer is DSX, which pulls from the DSX org.
#
# The destination orgs come from the `nvcr` environment:
#
#   NVKE_NGC_ORG              variable  NGC org id
#   NGC_REGISTRY_TOKEN_NVKE   secret    NGC API key with write access on the org
#   DSX_NGC_ORG_TEAM          variable  DSX NGC org/team path
#   NGC_REGISTRY_TOKEN_DSX    secret    NGC API key with write access on DSX
on:
  push:
    branches:
      - main
    tags:
      - "controller/v[0-9]+.[0-9]+.[0-9]+"
      - "controller/v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-beta.[0-9]+"
  workflow_dispatch: {}

permissions: {}

concurrency:
  # As image-nvcr.yml: the sha keeps every main commit in its own group, and the
  # name is a literal rather than ${{ github.workflow }}.
  group: Image Validate NVCR-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || '' }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository_id == '1323115536'
    name: Build and push
    runs-on: linux-amd64-cpu16
    environment: nvcr
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write       # the OIDC token the attestation is signed against
      attestations: write   # writes the provenance attestation
    outputs:
      image: ${{ steps.meta.outputs.image }}
      index_digest: ${{ steps.push.outputs.index_digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0          # git describe needs history and tags
          persist-credentials: false

      - name: Detect runner BuildKit config
        id: buildkit
        shell: bash
        run: |
          if [[ -r /etc/buildkit/buildkitd.toml ]]; then
            echo "config=/etc/buildkit/buildkitd.toml" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          buildkitd-config: ${{ steps.buildkit.outputs.config }}

      # `$oauthtoken` is NGC's literal username, not a variable reference.
      - name: Log in to NVCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: nvcr.io
          username: "$oauthtoken"
          password: ${{ secrets.NGC_REGISTRY_TOKEN_NVKE }}

      - name: Resolve destination and tags
        id: meta
        shell: bash
        env:
          NVKE_NGC_ORG: ${{ vars.NVKE_NGC_ORG }}
        run: |
          set -euo pipefail
          if [[ -z "${NVKE_NGC_ORG}" ]]; then
            echo "::error::NVKE_NGC_ORG is not set in the nvcr environment"
            exit 1
          fi

          # The controller image's version, so the two pair by tag.
          version="$(git describe --match 'controller/v*' --tags --always 2>/dev/null || git rev-parse --short HEAD)"
          version="${version#controller/}"

          tags=("sha-${GITHUB_SHA}" "${version}")
          if [[ "${GITHUB_REF}" == refs/heads/main ]]; then
            tags+=("edge")
          fi

          {
            echo "image=nvcr.io/${NVKE_NGC_ORG}/nvke-validate"
            echo "push_tags=${tags[*]}"
            echo "version=${version}"
          } >> "${GITHUB_OUTPUT}"
          echo "Publishing to nvcr.io/${NVKE_NGC_ORG}/nvke-validate as: ${tags[*]}"

      - name: Build and push
        id: push
        shell: bash
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          PUSH_TAGS: ${{ steps.meta.outputs.push_tags }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          # The version is passed so the label matches the tag this run
          # resolved; the rest of the reproducible inputs make derives from the
          # commit, as it does for anyone rebuilding it.
          make -C controller/test/e2e validate-image-push \
            VALIDATE_REPO="${IMAGE}" \
            VALIDATE_PUSH_TAGS="${PUSH_TAGS}" \
            VALIDATE_VERSION="${VERSION}"
          index="$(cat controller/test/e2e/bin/validate-image-digest.txt)"
          echo "index_digest=${index}" >> "${GITHUB_OUTPUT}"
          echo "- \`${IMAGE}\` index is \`${index}\`" >> "${GITHUB_STEP_SUMMARY}"

      - name: Check both architectures were published
        shell: bash
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          INDEX_DIGEST: ${{ steps.push.outputs.index_digest }}
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "${IMAGE}@${INDEX_DIGEST}" | tee "${RUNNER_TEMP}/index.txt"
          for arch in amd64 arm64; do
            grep -q "linux/${arch}" "${RUNNER_TEMP}/index.txt" \
              || { echo "::error::${IMAGE}@${INDEX_DIGEST} has no linux/${arch}"; exit 1; }
          done

      # push-to-registry is false because NVCR serves no referrers API; see
      # image-nvcr.yml and RELEASE.md.
      - name: Attest the published index
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.meta.outputs.image }}
          subject-digest: ${{ steps.push.outputs.index_digest }}
          push-to-registry: false

      - name: Record the published digest
        uses: ./.github/actions/record-digest
        with:
          references: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
          component: nvke-validate

  # The copy DSX pulls, beside the controller image this job's sibling in
  # image-nvcr.yml promotes.
  promote-dsx:
    name: Promote to DSX
    if: github.repository_id == '1323115536' && !(startsWith(github.ref, 'refs/tags/v') && contains(github.ref, '-beta.'))
    runs-on: linux-amd64-cpu8
    needs: [publish]
    environment: nvcr
    timeout-minutes: 20
    permissions:
      contents: read
      attestations: read   # reads the candidate's provenance back before promoting
    steps:
      # Before the checkout, because `gh attestation verify` resolves the
      # oci:// reference with the credential docker login writes.
      - name: Log in to NVCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: nvcr.io
          username: "$oauthtoken"
          password: ${{ secrets.NGC_REGISTRY_TOKEN_NVKE }}

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up crane
        uses: ./.github/actions/setup-crane

      - name: Verify the candidate before promoting it
        uses: ./.github/actions/verify-attestation
        with:
          image: ${{ needs.publish.outputs.image }}
          digest: ${{ needs.publish.outputs.index_digest }}
          signer-workflow: ${{ github.repository }}/.github/workflows/image-validate-nvcr.yml
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Pulled into an OCI layout with the NVKE token and pushed with the DSX
      # one: both orgs are on nvcr.io, and docker auth holds one credential
      # per host.
      - name: Promote image
        shell: bash
        env:
          NVKE_NGC_ORG: ${{ vars.NVKE_NGC_ORG }}
          DSX_NGC_ORG_TEAM: ${{ vars.DSX_NGC_ORG_TEAM }}
          NKE_NGC_TOKEN: ${{ secrets.NGC_REGISTRY_TOKEN_NVKE }}
          DSX_NGC_TOKEN: ${{ secrets.NGC_REGISTRY_TOKEN_DSX }}
          INDEX_DIGEST: ${{ needs.publish.outputs.index_digest }}
        run: |
          set -euo pipefail

          for var in NVKE_NGC_ORG DSX_NGC_ORG_TEAM; do
            if [[ -z "${!var}" ]]; then
              echo "::error::${var} is not set in the nvcr environment"
              exit 1
            fi
          done
          if [[ -z "${NKE_NGC_TOKEN}" ]]; then
            echo "::error::NGC_REGISTRY_TOKEN_NVKE is not set in the nvcr environment"
            exit 1
          fi
          if [[ -z "${DSX_NGC_TOKEN}" ]]; then
            echo "::error::NGC_REGISTRY_TOKEN_DSX is not set in the nvcr environment"
            exit 1
          fi
          if [[ -z "${INDEX_DIGEST}" ]]; then
            echo "::error::the publish job produced no index digest"
            exit 1
          fi

          version="$(git describe --match 'controller/v*' --tags --always 2>/dev/null || git rev-parse --short HEAD)"
          version="${version#controller/}"
          src="nvcr.io/${NVKE_NGC_ORG}/nvke-validate@${INDEX_DIGEST}"
          dst="nvcr.io/${DSX_NGC_ORG_TEAM}/nvke-validate"
          layout="${RUNNER_TEMP}/validate-image.oci"

          # shellcheck disable=SC2016
          echo "${NKE_NGC_TOKEN}" | crane auth login nvcr.io \
            -u '$oauthtoken' --password-stdin

          mkdir -p "${layout}"
          crane pull --format=oci "${src}" "${layout}"

          # shellcheck disable=SC2016
          echo "${DSX_NGC_TOKEN}" | crane auth login nvcr.io \
            -u '$oauthtoken' --password-stdin

          # A tag that already exists must already hold this digest.
          ensure_immutable_tag() {
            local target="${dst}:$1" target_digest
            if target_digest="$(crane digest "${target}" 2>/dev/null)"; then
              if [[ "${target_digest}" != "${INDEX_DIGEST}" ]]; then
                echo "::error::${target} already exists with digest ${target_digest}, expected ${INDEX_DIGEST}"
                exit 1
              fi
              echo "${target} already exists with matching digest"
              return
            fi
            crane push "${layout}" "${target}"
            target_digest="$(crane digest "${target}")"
            if [[ "${target_digest}" != "${INDEX_DIGEST}" ]]; then
              echo "::error::${target} pushed with digest ${target_digest}, expected ${INDEX_DIGEST}"
              exit 1
            fi
          }

          ensure_immutable_tag "${version}"
          if [[ "${GITHUB_REF}" == refs/heads/main ]]; then
            ensure_immutable_tag "sha-${GITHUB_SHA}"
            crane tag "${dst}:${version}" edge
          fi

          crane manifest "${dst}:${version}" > "${RUNNER_TEMP}/dsx-validate-manifest.json"
          for arch in amd64 arm64; do
            grep -Eq "\"architecture\"[[:space:]]*:[[:space:]]*\"${arch}\"" "${RUNNER_TEMP}/dsx-validate-manifest.json" \
              || { echo "::error::DSX image is missing linux/${arch}"; exit 1; }
          done

          {
            echo "- \`${dst}:${version}\` is \`${INDEX_DIGEST}\`"
            if [[ "${GITHUB_REF}" == refs/heads/main ]]; then
              echo "- \`${dst}:edge\` now points at \`${INDEX_DIGEST}\`"
            fi
            echo "- promoted from \`${src}\`, not rebuilt"
          } >> "${GITHUB_STEP_SUMMARY}"
