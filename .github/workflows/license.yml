---
# License enforcement for all Go modules in the monorepo.
#
# A discover-modules setup job finds every go.mod (excluding vendor/ and
# testdata/), then two matrix jobs fan out over its outputs so new components
# are covered automatically without workflow edits.
#
#   license-check — go-licenses (github.com/google/go-licenses) verifies all
#     transitive dependency licenses are permissive (no restricted/reciprocal/
#     forbidden/unknown types).  This is the same underlying tool used in the
#     existing GitLab CI pipeline; no proprietary wrapper is required here.
#     Modules that import private gitlab-master.nvidia.com packages are excluded
#     because those imports cannot be resolved from public runners.
#
#   header-check — `make file-license-check` verifies every source file carries
#     the required copyright header via addlicense.  This runs over the *full*
#     module list, including the modules excluded above: the target invokes
#     addlicense as `go run <pkg>@<version>`, which ignores the current module's
#     dependencies, so it needs no access to private imports.
#
# Release gate: the release workflow calls this workflow via workflow_call and
# gates publish jobs on it via `needs`.  See .github/workflows/release.yml.
name: License Checks

on:
  push:
    branches: [main]
    paths:
      - '**/*.go'
      - '**/go.mod'
      - '**/go.sum'
      # The shipped LICENSE/NOTICE copies derive from the root files and from
      # the Makefile that copies them, so all three trigger the check that
      # compares them.
      - 'LICENSE'
      - 'NOTICE'
      - 'Makefile'
      - 'controller/licenses/**'
      - 'controller/deploy/charts/cloud-workflow-engine/LICENSE'
      - 'controller/deploy/charts/cloud-workflow-engine/NOTICE'
      - '.github/workflows/license.yml'
  pull_request:
    branches: [main]
    paths:
      - '**/*.go'
      - '**/go.mod'
      - '**/go.sum'
      # The shipped LICENSE/NOTICE copies derive from the root files and from
      # the Makefile that copies them, so all three trigger the check that
      # compares them.
      - 'LICENSE'
      - 'NOTICE'
      - 'Makefile'
      - 'controller/licenses/**'
      - 'controller/deploy/charts/cloud-workflow-engine/LICENSE'
      - 'controller/deploy/charts/cloud-workflow-engine/NOTICE'
      - '.github/workflows/license.yml'
  workflow_call:

# This workflow works one module at a time, as it did before the repository
# gained a root go.work. GOWORK=off keeps it that way. It is also required:
# the license-check job sets GOTOOLCHAIN=local itself, and the Go version
# installed from a module's go.mod is older than the one go.work asks for, so
# leaving the workspace on fails with "go.work requires go >= 1.26.0".
# (This workflow pinned setup-go v5.6.0, which did not set GOTOOLCHAIN itself,
# until the 2026-08-13 bump to v7.0.0 — which does. The GOWORK=off above is what
# keeps that from mattering either way.)
env:
  GOWORK: "off"

jobs:
  discover-modules:
    name: Discover Go modules
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.find.outputs.modules }}
      header_modules: ${{ steps.find.outputs.header_modules }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Find Go modules
        id: find
        run: |
          all=$(find . -name go.mod \
            -not -path '*/vendor/*' \
            -not -path '*/testdata/*' \
            -exec dirname {} \; \
            | sort)

          # Dependency-license checks: go-licenses loads modules one at a time
          # (GOWORK=off, no vendor), so a module whose dependency cannot be
          # fetched from a public runner cannot be scanned. controller requires
          # github.com/NVIDIA/cluster-api-provider-nico, which is INTERNAL
          # visibility until it is open-sourced; drop this exclusion when the
          # repo goes public.
          modules=$(printf '%s\n' "$all" \
            | grep -vxF -e './controller' \
            | jq -R . | jq -sc .)
          echo "modules=$modules" >> "$GITHUB_OUTPUT"

          # Header checks: every module that exposes the Makefile target, with
          # no private-dependency exclusions (see the note at the top of this
          # file). A module without the target is silently absent from the
          # matrix, so list what was found to keep the gap visible in the log.
          header_modules=$(printf '%s\n' "$all" | while read -r m; do
            if [ -f "$m/Makefile" ] && grep -qE '^file-license-check:' "$m/Makefile"; then
              echo "$m"
            fi
          done | jq -R . | jq -sc .)
          echo "header_modules=$header_modules" >> "$GITHUB_OUTPUT"

          echo "dependency-license modules: $modules"
          echo "license-header modules:     $header_modules"

  license-check:
    name: License check (${{ matrix.module }})
    needs: [discover-modules]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: ${{ fromJson(needs.discover-modules.outputs.modules) }}
      fail-fast: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: '${{ matrix.module }}/go.mod'
          cache: true

      - name: Check dependency licenses
        working-directory: ${{ matrix.module }}
        # GOTOOLCHAIN=local prevents Go from downloading a golang.org/toolchain
        # module for stdlib, which confuses go-licenses into treating standard
        # library packages as unrecognised external packages.
        env:
          GOTOOLCHAIN: local
        run: |
          go install github.com/google/go-licenses/v2@latest
          go-licenses check ./... \
            --disallowed_types=restricted,reciprocal,forbidden,unknown \
            --ignore github.com/NVIDIA/nke \
            --ignore gitlab-master.nvidia.com

  header-check:
    name: License headers (${{ matrix.module }})
    needs: [discover-modules]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: ${{ fromJson(needs.discover-modules.outputs.header_modules) }}
      fail-fast: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: '${{ matrix.module }}/go.mod'
          cache: true

      # file-license-check runs addlicense in place and then fails on any
      # resulting git diff, so it needs a clean tree — which a fresh checkout is.
      - name: Verify license headers
        working-directory: ${{ matrix.module }}
        run: make file-license-check

  shipped-licenses:
    name: Shipped LICENSE and NOTICE copies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # No Go needed: the target is a copy and a diff. The controller image and
      # the Helm chart each read LICENSE and NOTICE from a copy inside their own
      # build context, because Docker cannot reach outside one and the root files
      # sit outside `controller/`. A copy is a thing that goes stale, and until
      # now nothing asserted these had not -- the chart's pair was committed by
      # hand and merely happened to match.
      - name: Verify the shipped copies match the root files
        run: make licenses-check
