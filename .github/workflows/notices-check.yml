# Regenerates THIRD_PARTY_NOTICES.md and fails if it differs from the committed
# copy, so a dependency change cannot land without refreshed attribution.
#
# Deliberately not filtered on changed paths. The inventory is the import
# closure of the released commands, so it moves when an ordinary .go file
# changes its imports, not only when go.mod moves. A path filter would pass
# green while the committed file went stale, and the failure would then surface
# on main rather than on the pull request that caused it.

name: Third-Party Notices

on:
  push:
    branches:
      - main
      - "pull-request/[0-9]+"
      # Dependabot pushes to a branch in this repository, which matches neither
      # of the two above, so this check has never run on a dependency bump --
      # the one kind of pull request most likely to stale the file. The failure
      # then surfaced on main after the merge, which is exactly how syscmp's
      # main went red on 2026-08-12. The other three repositories closed this
      # elsewhere; nke was assumed covered by its pull_request-triggered
      # workflows, but only three of its twelve are, and this is not one.
      #
      # Self-hosted runners do not receive pull_request events -- see the header
      # of lint.yml -- so this job cannot switch triggers. It has to name the
      # branch.
      - "dependabot/**"
  workflow_dispatch:

permissions: {}

concurrency:
  # The sha is part of the group on main, so every commit gets its own.
  # Without it, back-to-back merges lose CI results: GitHub allows one
  # running and one pending run per group, and cancels the pending one
  # when a third arrives -- whatever cancel-in-progress says, because that
  # setting only protects a run that has already started. Five merges in
  # three minutes cancelled 18 runs across 7 workflows this way, leaving
  # three consecutive commits on main with no test result at all.
  #
  # Pull-request branches keep sharing a group and still cancel, which is
  # what you want there.
  # A literal name, NOT ${{ github.workflow }}. Inside a called workflow that
  # expression is the CALLER's name, so any workflow merge-gate.yml calls would
  # share a group with its siblings and cancel them. 8 of 9 calls died that way,
  # reported as failures with no jobs and no error message.
  group: Third-Party Notices-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || '' }}
  # Do not cancel a run on main: back-to-back merges would otherwise
  # discard this check's result for the intermediate commit, leaving a
  # commit on main that nothing ever verified. Same guard as the other
  # workflows here.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# This workflow works one module at a time, as it did before the repository
# gained a root go.work. GOWORK=off keeps it that way. It is also required:
# actions/setup-go pins GOTOOLCHAIN=local, and the Go version installed from a
# module's go.mod is older than the one go.work asks for, so leaving the
# workspace on fails with "go.work requires go >= 1.26.0".
env:
  GOWORK: "off"

jobs:
  notices-check:
    name: Check THIRD_PARTY_NOTICES.md is up to date
    runs-on: linux-amd64-cpu16
    if: github.repository == 'NVIDIA/nke'
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # go.work, not agent/go.mod. setup-go pins GOTOOLCHAIN=local, so the
      # installed Go is the only one available -- and the controller and nkectl
      # steps below clear GOWORK, which puts go.work's floor in force. Installing
      # from agent/go.mod would give an older Go and fail those steps with
      # "go.work requires go >= 1.26.5". The workspace Go satisfies every module,
      # including agent, so one version serves all three.
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache: true
          cache-dependency-path: |
            go.work.sum
            **/go.sum

      # All three redistributed binaries are covered. This job used to check the
      # agent alone, because go-licenses could not resolve the controller's
      # graph with GOWORK=off: the module would have had to download the
      # INTERNAL cluster-api-provider-nico.
      #
      # What runs now is the alternative the old comment called "worth trying;
      # not attempted here" -- let go-licenses read the committed vendor tree
      # and download nothing. Two things had to be true for that to work.
      #
      # First, go-licenses requires its rootDir to CONTAIN the vendor tree it
      # reads, and this repository vendors once at the workspace root, above
      # every module. Run from controller/ it fails outright: "rootDir
      # /…/controller should contain dir /…/vendor/k8s.io/…". So
      # hack/generate-notices now walks up to whichever directory owns vendor/
      # and names packages relative to it, which lets one generator serve every
      # module in the workspace.
      #
      # Second, go-licenses embeds golang.org/x/tools/go/packages and must be
      # built with the SAME toolchain that `go list` runs under. On a mismatch
      # it reports every stdlib package as "does not have module info" and
      # produces nothing -- a failure that reads like a broken generator rather
      # than a version skew. controller/Makefile pins that toolchain, and the
      # two jobs below reuse the binary it builds.
      - name: Verify agent THIRD_PARTY_NOTICES.md is up to date
        working-directory: agent
        run: make notices-check

      # GOWORK is cleared for these two: they need the workspace, because the
      # vendor tree they read is a workspace-level construct.
      - name: Verify controller THIRD_PARTY_NOTICES.md is up to date
        working-directory: controller
        env:
          GOWORK: ""
        run: make notices-check

      - name: Verify nkectl THIRD_PARTY_NOTICES.md is up to date
        working-directory: cli
        env:
          GOWORK: ""
        run: make notices-check
