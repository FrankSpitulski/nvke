name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+'
      - '*/v[0-9]*'
  workflow_dispatch:

# Least privilege by default. Only the release job needs contents: write, and
# it is granted there; license-checks and publish read only.
permissions: {}

# Keyed on the ref, so two different tags never share a group and run
# concurrently. This only binds when the same tag is re-pushed or a run is
# re-run, and there it does not cancel: a half-finished release run can leave a
# tag with a partial release.
concurrency:
  # The sha is part of the group on main, so every commit gets its own.
  # Without it, back-to-back merges lose CI results: GitHub allows one
  # running and one pending run per group, and cancels the pending one
  # when a third arrives -- whatever cancel-in-progress says, because that
  # setting only protects a run that has already started. Five merges in
  # three minutes cancelled 18 runs across 7 workflows this way, leaving
  # three consecutive commits on main with no test result at all.
  #
  # Pull-request branches keep sharing a group and still cancel, which is
  # what you want there.
  # A literal name, NOT ${{ github.workflow }}. Inside a called workflow that
  # expression is the CALLER's name, so any workflow merge-gate.yml calls would
  # share a group with its siblings and cancel them. 8 of 9 calls died that way,
  # reported as failures with no jobs and no error message.
  group: Release-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || '' }}
  cancel-in-progress: false

jobs:
  license-checks:
    name: License checks (gate)
    uses: ./.github/workflows/license.yml
    permissions:
      contents: read

  release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [license-checks]
    permissions:
      contents: write   # creates the GitHub release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # A tag is <module-directory>/vX.Y.Z, because that is what Go requires of a
      # submodule: github.com/NVIDIA/nke/cli is tagged cli/vX.Y.Z. So the
      # directory is read back off the tag and nothing below needs to name a
      # component. Move a module and its tag prefix moves with it, because Go
      # makes them the same string; go.work then says whether the directory is
      # real. A bare vX.Y.Z is the whole repository.
      - name: Resolve the component from the tag
        id: component
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"

          if [[ "${TAG}" == */* ]]; then
            DIR="${TAG%/v*}"
            VERSION="v${TAG##*/v}"
            if ! go work edit -json | jq -e --arg d "./${DIR}" \
                 '.Use[]|select(.DiskPath==$d)' >/dev/null; then
              echo "::error::${TAG} names '${DIR}', which is not a module in go.work."
              echo "go.work lists:"; go work edit -json | jq -r '.Use[].DiskPath'
              exit 1
            fi
          else
            DIR=""
            VERSION="${TAG}"
          fi

          # The two forms the root tags are already held to at the top of this
          # file. The component pattern there cannot be that strict, because a
          # glob cannot spell "vX.Y.Z", so the rule is enforced here instead.
          # It fails rather than skips: a tighter glob would let a malformed tag
          # push do nothing at all, and silence reads as success.
          if [[ ! "${VERSION}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]; then
            echo "::error::${TAG} carries version '${VERSION}', which is neither vX.Y.Z nor vX.Y.Z-rc.N."
            echo "A release candidate needs the dot: v0.1.0-rc.0, not v0.1.0-rc0."
            echo "Delete the tag, then push a corrected one."
            exit 1
          fi

          echo "dir=${DIR}"         >> "${GITHUB_OUTPUT}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "Releasing ${TAG}: module='${DIR:-<repository>}' version=${VERSION}"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: cli/go.mod

      # What each component ships differs, so it is declared rather than guessed.
      # A component with no artifacts still gets a release: the tag and its notes
      # are the point and the files are a bonus.
      - name: Build release artifacts
        id: artifacts
        shell: bash
        env:
          DIR: ${{ steps.component.outputs.dir }}
        run: |
          set -euo pipefail
          mkdir -p dist

          case "${DIR}" in
            cli)
              make -C cli build-cross DIST="${GITHUB_WORKSPACE}/dist"
              # Shipped beside the binaries because nkectl is redistributed --
              # which is the reason it carries its own attribution at all.
              cp cli/THIRD_PARTY_NOTICES.md dist/
              ;;
            *)
              echo "No artifacts defined for '${DIR:-<repository>}'; releasing notes only."
              ;;
          esac

          if find dist -mindepth 1 -maxdepth 1 -print -quit | grep -q .; then
            ( cd dist && sha256sum -- * > checksums.txt )
            echo "artifacts:"
            find dist -mindepth 1 -maxdepth 1 -printf '  %f\n' | sort
            echo "has_files=true" >> "${GITHUB_OUTPUT}"
          else
            rmdir dist
            echo "has_files=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Extract changelog section for this tag
        id: changelog
        shell: bash
        env:
          # The resolved version, not the raw ref. CHANGELOG.md headings carry
          # neither the "v" nor the module prefix, so `cli/v0.1.0` read raw
          # would look for "## [cli/v0.1.0]" and match
          # nothing. That does not fail -- the fallback fires -- so the release
          # would quietly ship a one-line body.
          VERSION: ${{ steps.component.outputs.version }}
        run: |
          set -euo pipefail
          TAG="${VERSION#v}"
          NOTES=$(awk "/^## \[${TAG}\]/{found=1; next} found && /^## \[/{exit} found{print}" CHANGELOG.md)
          if [ -z "$NOTES" ]; then
            NOTES="See [CHANGELOG.md](CHANGELOG.md) for details."
          fi
          # Written to a file to avoid quoting issues
          echo "$NOTES" > /tmp/release-notes.md

      - name: Create GitHub release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          body_path: /tmp/release-notes.md
          prerelease: ${{ contains(github.ref_name, '-rc.') }}
          generate_release_notes: false
          # Empty when the component ships nothing, which the action accepts.
          files: ${{ steps.artifacts.outputs.has_files == 'true' && 'dist/*' || '' }}

  # Still a placeholder, but no longer the only thing a prefixed tag reaches:
  # the release job above now handles every tag, so this is for publishing that
  # is not a GitHub release asset -- registries, apt, and so on.
  publish:
    name: Publish
    needs: [license-checks]
    if: ${{ contains(github.ref_name, '/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      # Component publish lives in dedicated workflows so each component can
      # own its runners, secrets and artifact shape. agent/v* .debs go through
      # agent-deb-publish.yml (S3 apt intake); binaries through
      # agent-artifact.yml / agent-artifact-nvcr.yml. This job only records
      # which path fired so a component tag never looks like a no-op release.
      - name: Route component publish
        run: |
          set -euo pipefail
          case "${GITHUB_REF_NAME}" in
            agent/v*)
              echo "Agent tag ${GITHUB_REF_NAME}:"
              echo "  - .debs  → Agent Deb Publish (apt-intake S3)"
              echo "  - binary → Agent Artifact / Agent Artifact NVCR"
              ;;
            *)
              echo "::warning::No component publish workflow for '${GITHUB_REF_NAME}' yet (NKX-14116)."
              ;;
          esac
