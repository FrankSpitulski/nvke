# Full CAPD integration test using controller and agent source from this commit.
#
# The body lives in backend-e2e.yml, shared with nico-e2e.yml. This file is the
# CAPD trigger and configuration, nothing more.
#
# Self-hosted runners do not receive pull_request events. copy-pr-bot mirrors a
# vetted pull request head to pull-request/<number>; the push of that same commit
# is the security boundary and trigger used by the other self-hosted checks.
# Run this gate only when controller, agent, or root Makefile changes can affect
# the CAPD lifecycle exercised here.

name: CAPD E2E

on:
  push:
    branches:
      - main
      - "pull-request/[0-9]+"
    paths:
      - "controller/**"
      - "agent/**"
      - Makefile
      # Without these, a change to the suite's own workflow or to the shared
      # body does not run it.
      - .github/workflows/capd-e2e.yml
      - .github/workflows/backend-e2e.yml
  workflow_dispatch:

permissions: {}

concurrency:
  group: CAPD E2E-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  capd-e2e:
    uses: ./.github/workflows/backend-e2e.yml
    permissions:
      contents: read
    with:
      backend: capd
      # One filter for pull requests and main. Excluding post-ready, scale and
      # reboot on a pull request meant a break in those only showed up on main,
      # in a job nothing requires.
      #
      # `health` rides along: those specs need a cluster running CWE, which this
      # lane has already built by the time the suite starts.
      label-filter: capd || health
      providers: '["capi_core", "bgp-containers", "capd", "capd-reboot-controller"]'
      timeout-minutes: 90
