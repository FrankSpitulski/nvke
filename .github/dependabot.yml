version: 2
updates:
  # Go modules anywhere in the tree. This is a nested multi-module monorepo
  # (node-agent, controller, controller/api, controller/forge-vms,
  # controller/test/e2e, controller/hack/*, ...), so the recursive "/**/*" glob
  # is required — "/*" only matches depth-1 dirs and would miss the nested modules.
  # New components with their own go.mod are picked up automatically.
  - package-ecosystem: gomod
    directories:
      - "/**/*"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      prefix: "build"
      prefix-development: "build"
    groups:
      go-dependencies:
        patterns:
          - "*"

  # Dockerfiles anywhere in the tree (controller/, controller/hack/*, node-agent/, ...).
  - package-ecosystem: docker
    directories:
      - "/**/*"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      prefix: "build"
    groups:
      docker-images:
        patterns:
          - "*"

  # Shared GitHub Actions workflows (repo root). Inert until workflows land on
  # the default branch; kept here so updates start automatically once they do.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "build"
    groups:
      github-actions:
        patterns:
          - "*"
